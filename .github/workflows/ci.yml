name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧运行，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test / typecheck / build)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # 刻意用 npm ci 而非 npm install：只有它会在 lockfile 不同步
      # 或干净 clone 缺文件时大声失败 —— 这正是本 job 要抓的那类问题。
      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Unit tests + ratchet gates
        run: npm test

      - name: Type check
        run: npx vue-tsc --noEmit

      # 直接调 vite build（不走 npm run build，避免重复跑一遍 vue-tsc）。
      # 这一步会捕获 "src/css/tokens/ 被 gitignore 排除" 那一类
      # "本地能构建、干净 clone 构建不出来" 的问题。
      - name: Build
        run: npx vite build

      - name: Release metadata and reproducible build gates
        run: |
          node scripts/release-readiness.mjs
          node scripts/verify-reproducible-build.mjs

  rust:
    name: Rust (test / clippy)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        # Tauri v2 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Dependency audit
        run: cargo audit --file src-tauri/Cargo.lock
