[workspace]
members = [
  "crates/lovelyres-core",
  "crates/lovelyres-electron-backend",
  "crates/lovelyres-terminal",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93.1"
license = "AGPL-3.0-only"
authors = ["LovelyRes Team"]
repository = "https://github.com/Tokeii0/LovelyERes"

[workspace.dependencies]
aes-gcm = "0.10"
alacritty_terminal = "=0.25.1"
async-channel = "2.5"
async-trait = "0.1"
base64 = "0.21"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
russh = { version = "0.62.5", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

# SSH crypto (russh/ring) and the alacritty terminal grid dominate debug-build
# sidecar latency; keep dependencies optimized so development terminals stay
# responsive under load.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "unwind"
lto = true
opt-level = 3
strip = true
codegen-units = 1
