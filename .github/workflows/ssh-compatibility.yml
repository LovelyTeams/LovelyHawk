name: SSH compatibility matrix

on:
  pull_request:
    paths:
      - 'src-tauri/src/ssh_manager_russh.rs'
      - 'src-tauri/src/ssh_compat.rs'
      - 'src-tauri/src/commands/ssh_commands.rs'
      - 'src-tauri/src/types.rs'
      - 'src/modules/core/targetCapabilities.ts'
      - 'src/modules/ssh/**'
      - 'src/modules/remote/sshConnectionManager.ts'
      - 'src/modules/ui/serverModalManager.ts'
      - 'src/modules/ui/renderers/serverModalRenderer.ts'
      - 'tests/ssh-compat/**'
      - 'scripts/start-ssh-compat-target.sh'
      - 'docs/SSH_COMPATIBILITY.md'
      - '.github/workflows/ssh-compatibility.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ssh-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Load compatibility contract
    runs-on: ubuntu-24.04
    outputs:
      openssh: ${{ steps.values.outputs.openssh }}
      distros: ${{ steps.values.outputs.distros }}
    steps:
      - uses: actions/checkout@v4
      - id: values
        run: |
          echo "openssh=$(jq -c '.openssh' tests/ssh-compat/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "distros=$(jq -c '.distros' tests/ssh-compat/matrix.json)" >> "$GITHUB_OUTPUT"

  openssh-versions:
    name: ${{ matrix.target.label }}
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.openssh) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Start versioned OpenSSH target
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          bash scripts/start-ssh-compat-target.sh '${{ matrix.target.image }}' lovelyres-version-target 2222 password /tmp/lovelyres-ssh-fixtures
          docker exec lovelyres-version-target sh -lc 'ssh -V' 2>&1 | tee /tmp/sshd-version
          grep -E '${{ matrix.target.expectedVersion }}' /tmp/sshd-version
      - name: Run russh command, SFTP and capability contract
        env:
          LOVELYRES_TEST_SSH_HOST: 127.0.0.1
          LOVELYRES_TEST_SSH_PORT: 2222
          LOVELYRES_TEST_SSH_USER: incident
          LOVELYRES_TEST_SSH_AUTH_TYPE: password
          LOVELYRES_TEST_SSH_PASSWORD: lovelyres-contract-password
          LOVELYRES_TEST_EXPECT_PCAP: 'false'
        run: |
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture
      - if: always()
        run: docker rm -f lovelyres-version-target >/dev/null 2>&1 || true

  dropbear:
    name: Dropbear server contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Start Dropbear target
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          bash scripts/start-ssh-compat-target.sh alpine:3.20 lovelyres-dropbear-target 2222 dropbear /tmp/lovelyres-ssh-fixtures
      - name: Run non-OpenSSH compatibility contract
        env:
          LOVELYRES_TEST_SSH_HOST: 127.0.0.1
          LOVELYRES_TEST_SSH_PORT: 2222
          LOVELYRES_TEST_SSH_USER: incident
          LOVELYRES_TEST_SSH_AUTH_TYPE: password
          LOVELYRES_TEST_SSH_PASSWORD: lovelyres-contract-password
          LOVELYRES_TEST_EXPECT_SFTP: 'false'
          LOVELYRES_TEST_EXPECT_PCAP: 'false'
        run: |
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture
      - if: always()
        run: docker rm -f lovelyres-dropbear-target >/dev/null 2>&1 || true

  linux-distros:
    name: ${{ matrix.target.label }}
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.distros) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Start distro target and verify identity
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          bash scripts/start-ssh-compat-target.sh '${{ matrix.target.image }}' lovelyres-distro-target 2222 password /tmp/lovelyres-ssh-fixtures
          docker exec lovelyres-distro-target cat /etc/os-release | grep -i '${{ matrix.target.expectedOs }}'
      - name: Run distro capability contract
        env:
          LOVELYRES_TEST_SSH_HOST: 127.0.0.1
          LOVELYRES_TEST_SSH_PORT: 2222
          LOVELYRES_TEST_SSH_USER: incident
          LOVELYRES_TEST_SSH_AUTH_TYPE: password
          LOVELYRES_TEST_SSH_PASSWORD: lovelyres-contract-password
          LOVELYRES_TEST_EXPECT_PCAP: 'false'
        run: |
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture
      - if: always()
        run: docker rm -f lovelyres-distro-target >/dev/null 2>&1 || true

  authentication:
    name: Auth ${{ matrix.auth }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        auth: [password, key, ecdsa-key, certificate, keyboard-interactive, agent, rsa-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Generate authentication fixtures
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          ssh-keygen -q -t ecdsa -b 256 -N '' -f /tmp/lovelyres-ssh-fixtures/user_ecdsa
          ssh-keygen -q -t rsa -b 3072 -N '' -f /tmp/lovelyres-ssh-fixtures/user_rsa
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_ca
          ssh-keygen -q -s /tmp/lovelyres-ssh-fixtures/user_ca -I lovelyres-contract -n incident -V -1m:+30m /tmp/lovelyres-ssh-fixtures/user_key.pub
          if [ '${{ matrix.auth }}' = ecdsa-key ]; then cp /tmp/lovelyres-ssh-fixtures/user_ecdsa.pub /tmp/lovelyres-ssh-fixtures/user_key.pub; fi
          if [ '${{ matrix.auth }}' = rsa-agent ]; then cp /tmp/lovelyres-ssh-fixtures/user_rsa.pub /tmp/lovelyres-ssh-fixtures/user_key.pub; fi
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-auth-target 2222 '${{ matrix.auth }}' /tmp/lovelyres-ssh-fixtures
      - name: Run authentication contract
        shell: bash
        run: |
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          export LOVELYRES_TEST_SSH_HOST=127.0.0.1 LOVELYRES_TEST_SSH_PORT=2222 LOVELYRES_TEST_SSH_USER=incident
          export LOVELYRES_TEST_SSH_AUTH_TYPE='${{ matrix.auth }}' LOVELYRES_TEST_EXPECT_PCAP=false
          case '${{ matrix.auth }}' in
            password) export LOVELYRES_TEST_SSH_PASSWORD=lovelyres-contract-password ;;
            key) export LOVELYRES_TEST_SSH_KEY_PATH=/tmp/lovelyres-ssh-fixtures/user_key ;;
            ecdsa-key)
              export LOVELYRES_TEST_SSH_AUTH_TYPE=key
              export LOVELYRES_TEST_SSH_KEY_PATH=/tmp/lovelyres-ssh-fixtures/user_ecdsa
              ;;
            certificate)
              export LOVELYRES_TEST_SSH_KEY_PATH=/tmp/lovelyres-ssh-fixtures/user_key
              export LOVELYRES_TEST_SSH_CERTIFICATE_PATH=/tmp/lovelyres-ssh-fixtures/user_key-cert.pub
              ;;
            keyboard-interactive) export LOVELYRES_TEST_SSH_KBDINT_RESPONSES_JSON='["lovelyres-contract-password"]' ;;
            agent)
              eval "$(ssh-agent -s)"
              ssh-add /tmp/lovelyres-ssh-fixtures/user_key
              trap 'ssh-agent -k >/dev/null' EXIT
              ;;
            rsa-agent)
              export LOVELYRES_TEST_SSH_AUTH_TYPE=agent
              eval "$(ssh-agent -s)"
              ssh-add /tmp/lovelyres-ssh-fixtures/user_rsa
              trap 'ssh-agent -k >/dev/null' EXIT
              ;;
          esac
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture
      - if: always()
        run: docker rm -f lovelyres-auth-target >/dev/null 2>&1 || true

  jump-host:
    name: Auth jump-host / ProxyJump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Start target behind a bastion
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          docker network create lovelyres-jump-network
          export LOVELYRES_DOCKER_NETWORK=lovelyres-jump-network
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-jump-target 2223 password /tmp/lovelyres-ssh-fixtures
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-jump-host 2222 password /tmp/lovelyres-ssh-fixtures
      - name: Run direct-tcpip jump contract
        env:
          LOVELYRES_TEST_SSH_HOST: lovelyres-jump-target
          LOVELYRES_TEST_SSH_PORT: 22
          LOVELYRES_TEST_SSH_USER: incident
          LOVELYRES_TEST_SSH_AUTH_TYPE: password
          LOVELYRES_TEST_SSH_PASSWORD: lovelyres-contract-password
          LOVELYRES_TEST_SSH_JUMP_HOST: 127.0.0.1
          LOVELYRES_TEST_SSH_JUMP_PORT: 2222
          LOVELYRES_TEST_SSH_JUMP_USER: incident
          LOVELYRES_TEST_SSH_JUMP_AUTH_TYPE: password
          LOVELYRES_TEST_SSH_JUMP_PASSWORD: lovelyres-contract-password
          LOVELYRES_TEST_EXPECT_PCAP: 'false'
        run: |
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-jump-key 2>/dev/null
          export LOVELYRES_TEST_SSH_JUMP_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-jump-key -E sha256 | awk '{print $2}')"
          docker exec lovelyres-jump-host ssh-keyscan -p 22 -t ed25519 lovelyres-jump-target > /tmp/lovelyres-target-key 2>/dev/null
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-target-key -E sha256 | awk '{print $2}')"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture
      - if: always()
        run: |
          docker rm -f lovelyres-jump-target lovelyres-jump-host >/dev/null 2>&1 || true
          docker network rm lovelyres-jump-network >/dev/null 2>&1 || true

  subsystem-faults:
    name: Fault ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [no-sftp, no-pty, high-latency]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - name: Start constrained target
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          mode='${{ matrix.mode }}'
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-fault-target 2222 "$mode" /tmp/lovelyres-ssh-fixtures
          if [ "$mode" = high-latency ]; then
            docker exec lovelyres-fault-target tc qdisc add dev eth0 root netem delay 300ms 50ms
          fi
      - name: Verify graceful degradation
        env:
          LOVELYRES_TEST_SSH_HOST: 127.0.0.1
          LOVELYRES_TEST_SSH_PORT: 2222
          LOVELYRES_TEST_SSH_USER: incident
          LOVELYRES_TEST_SSH_AUTH_TYPE: password
          LOVELYRES_TEST_SSH_PASSWORD: lovelyres-contract-password
          LOVELYRES_TEST_EXPECT_PCAP: 'false'
        run: |
          mode='${{ matrix.mode }}'
          if [ "$mode" = no-sftp ]; then export LOVELYRES_TEST_EXPECT_SFTP=false; fi
          if [ "$mode" = no-pty ]; then export LOVELYRES_TEST_EXPECT_PTY=false; fi
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture
      - if: always()
        run: docker rm -f lovelyres-fault-target >/dev/null 2>&1 || true

  ipv6:
    name: Fault IPv6-only address
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - name: Start IPv6 target
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          docker network create --ipv6 --subnet fd00:10::/64 lovelyres-ipv6
          export LOVELYRES_DOCKER_NETWORK=lovelyres-ipv6
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-ipv6-target 2222 password /tmp/lovelyres-ssh-fixtures
      - name: Verify raw IPv6 literal connection
        run: |
          target_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.GlobalIPv6Address}}{{end}}' lovelyres-ipv6-target)"
          test -n "$target_ip"
          docker exec lovelyres-ipv6-target sh -lc "ssh-keyscan -p 22 -t ed25519 '$target_ip'" > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_HOST="$target_ip" LOVELYRES_TEST_SSH_PORT=22 LOVELYRES_TEST_SSH_USER=incident
          export LOVELYRES_TEST_SSH_AUTH_TYPE=password LOVELYRES_TEST_SSH_PASSWORD=lovelyres-contract-password
          export LOVELYRES_TEST_EXPECT_PCAP=false
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture
      - if: always()
        run: |
          docker rm -f lovelyres-ipv6-target >/dev/null 2>&1 || true
          docker network rm lovelyres-ipv6 >/dev/null 2>&1 || true

  disconnect:
    name: Fault mid-command disconnect
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - name: Verify disconnect is surfaced
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-disconnect-target 2222 password /tmp/lovelyres-ssh-fixtures
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_HOST=127.0.0.1 LOVELYRES_TEST_SSH_PORT=2222 LOVELYRES_TEST_SSH_USER=incident
          export LOVELYRES_TEST_SSH_AUTH_TYPE=password LOVELYRES_TEST_SSH_PASSWORD=lovelyres-contract-password
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          export LOVELYRES_TEST_DISCONNECT_READY_FILE=/tmp/lovelyres-disconnect-ready
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_ssh_disconnect_contract -- --ignored --nocapture &
          test_pid=$!
          for _ in $(seq 1 60); do
            [ -f "$LOVELYRES_TEST_DISCONNECT_READY_FILE" ] && break
            sleep 1
          done
          test -f "$LOVELYRES_TEST_DISCONNECT_READY_FILE"
          docker kill lovelyres-disconnect-target >/dev/null
          wait "$test_pid"
      - if: always()
        run: docker rm -f lovelyres-disconnect-target >/dev/null 2>&1 || true

  host-key-change:
    name: Fault host key change
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - name: Verify stale fingerprint is rejected
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-host-key-target 2222 password /tmp/lovelyres-ssh-fixtures
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-old-host-key 2>/dev/null
          stale="$(ssh-keygen -lf /tmp/lovelyres-old-host-key -E sha256 | awk '{print $2}')"
          docker rm -f lovelyres-host-key-target >/dev/null
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-host-key-target 2222 password /tmp/lovelyres-ssh-fixtures
          export LOVELYRES_TEST_SSH_HOST=127.0.0.1 LOVELYRES_TEST_SSH_PORT=2222 LOVELYRES_TEST_SSH_USER=incident
          export LOVELYRES_TEST_SSH_AUTH_TYPE=password LOVELYRES_TEST_SSH_PASSWORD=lovelyres-contract-password
          export LOVELYRES_TEST_SSH_STALE_FINGERPRINT="$stale"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_ssh_host_key_change_contract -- --ignored --nocapture
      - if: always()
        run: docker rm -f lovelyres-host-key-target >/dev/null 2>&1 || true

  restricted-account:
    name: Fault restricted account
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - name: Verify restricted account failure is explicit
        run: |
          mkdir -p /tmp/lovelyres-ssh-fixtures
          ssh-keygen -q -t ed25519 -N '' -f /tmp/lovelyres-ssh-fixtures/user_key
          bash scripts/start-ssh-compat-target.sh ubuntu:24.04 lovelyres-restricted-target 2222 restricted-account /tmp/lovelyres-ssh-fixtures
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null
          export LOVELYRES_TEST_SSH_HOST=127.0.0.1 LOVELYRES_TEST_SSH_PORT=2222 LOVELYRES_TEST_SSH_USER=incident
          export LOVELYRES_TEST_SSH_AUTH_TYPE=password LOVELYRES_TEST_SSH_PASSWORD=lovelyres-contract-password
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}')"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_ssh_restricted_account_contract -- --ignored --nocapture
      - if: always()
        run: docker rm -f lovelyres-restricted-target >/dev/null 2>&1 || true
