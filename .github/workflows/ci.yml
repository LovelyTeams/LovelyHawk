name: Windows Build & CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows quality gates & portable build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy, llvm-tools-preview

      - name: Restore Cargo build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - name: Install locked UI dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify gate failure detection
        shell: pwsh
        run: |
          ./scripts/desktop-quality-gates.ps1 -SelfTest
          ./scripts/desktop-source-gate.ps1 -SelfTest
          ./scripts/desktop-dependency-gate.ps1 -SelfTest
          ./scripts/desktop-ui-ledger-gate.ps1 -SelfTest
          ./scripts/desktop-validate-package.ps1 -SelfTest

      - name: Run desktop and Rust quality gates
        shell: pwsh
        run: ./scripts/desktop-quality-gates.ps1

      - name: Build and validate Windows x64 portable package
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath './crates/lovelyhawk-desktop/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = [string]$config.version
          ./scripts/desktop-package-windows.ps1 -Version $version -Build

      - name: Upload Windows portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: LovelyHawk-windows-x64
          path: |
            artifacts/LovelyHawk-*-windows-x64.zip
            artifacts/LovelyHawk-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/LovelyHawk-*-windows-x64.zip
            artifacts/LovelyHawk-*-windows-x64.zip.sha256
