name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.8.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Release gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
          components: clippy

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Version, bundle and release workflow gate
        run: node scripts/release-readiness.mjs "${RELEASE_TAG}"

      - name: Frontend tests and offline gates
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Reproducible production build
        run: node scripts/verify-reproducible-build.mjs

      - name: Rust tests and clippy
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Dependency vulnerability gates
        run: |
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock

  linux-ssh-contract:
    name: Real Linux SSH/SFTP contract
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Start disposable Linux SSH target
        run: |
          docker run -d --name lovelyres-linux-target -p 127.0.0.1:2222:2222 \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC \
            -e USER_NAME=incident -e USER_PASSWORD=lovelyres-contract-password \
            -e PASSWORD_ACCESS=true -e SUDO_ACCESS=true \
            lscr.io/linuxserver/openssh-server:latest
          for i in $(seq 1 30); do
            ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > /tmp/lovelyres-host-key 2>/dev/null && break
            sleep 1
          done
          test -s /tmp/lovelyres-host-key
          ssh-keygen -lf /tmp/lovelyres-host-key -E sha256 | awk '{print $2}' > /tmp/lovelyres-fingerprint
          docker exec -u 0 lovelyres-linux-target sh -lc '
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache tcpdump coreutils
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y tcpdump coreutils
            else
              echo "Unsupported target package manager" >&2
              exit 1
            fi
          '

      - name: Exercise the real russh transport contract
        env:
          LOVELYRES_TEST_SSH_HOST: 127.0.0.1
          LOVELYRES_TEST_SSH_PORT: 2222
          LOVELYRES_TEST_SSH_USER: incident
          LOVELYRES_TEST_SSH_PASSWORD: lovelyres-contract-password
        run: |
          export LOVELYRES_TEST_SSH_FINGERPRINT="$(cat /tmp/lovelyres-fingerprint)"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_linux_ssh_contract -- --ignored --nocapture

  bundle:
    name: Bundle ${{ matrix.label }}
    needs: [quality, linux-ssh-contract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux-x64
            bundles: deb,appimage
          - platform: windows-latest
            label: windows-x64
            bundles: nsis,msi
          - platform: macos-latest
            label: macos
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build platform installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'LovelyERes v__VERSION__'
          releaseBody: 'Cross-platform installers, SHA-256 checksums, SBOM and build provenance are attached.'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Linux installer startup smoke
        if: runner.os == 'Linux'
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          sudo apt-get install -y "$deb"
          ready_file="/tmp/lovelyres-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          LOVELYRES_SMOKE_READY_FILE="$ready_file" xvfb-run -a lovelyres >/tmp/lovelyres-startup.log 2>&1 &
          app_pid=$!
          for i in $(seq 1 40); do
            kill -0 "$app_pid"
            test -s "$ready_file" && break
            sleep 0.25
          done
          test -s "$ready_file"
          grep -q '"schema":"lovelyres-smoke-ready/v1"' "$ready_file"
          grep -q '"status":"ready"' "$ready_file"
          kill "$app_pid"
          wait "$app_pid" || true
          rm -f -- "$ready_file"

      - name: Windows NSIS install and startup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          ./scripts/windows-install-smoke.ps1 -InstallerPath $installer.FullName

      - name: macOS application startup smoke
        if: runner.os == 'macOS'
        run: |
          app_binary="$(find src-tauri/target/release/bundle/macos -type f -path '*.app/Contents/MacOS/*' -perm -111 -print -quit)"
          test -n "$app_binary"
          ready_file="${TMPDIR%/}/lovelyres-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          LOVELYRES_SMOKE_READY_FILE="$ready_file" "$app_binary" >/tmp/lovelyres-startup.log 2>&1 &
          app_pid=$!
          for i in $(seq 1 40); do
            kill -0 "$app_pid"
            test -s "$ready_file" && break
            sleep 0.25
          done
          test -s "$ready_file"
          grep -q '"schema":"lovelyres-smoke-ready/v1"' "$ready_file"
          grep -q '"status":"ready"' "$ready_file"
          kill "$app_pid"
          wait "$app_pid" || true
          rm -f -- "$ready_file"

      - name: Generate SHA-256 checksums (Unix)
        if: runner.os != 'Windows'
        run: |
          find src-tauri/target/release/bundle -type f -print0 | sort -z | xargs -0 shasum -a 256 > "SHA256SUMS-${{ matrix.label }}.txt"

      - name: Generate SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            $relative = [System.IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
            "$hash  $relative"
          } | Set-Content -Encoding utf8 "SHA256SUMS-${{ matrix.label }}.txt"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ matrix.label }}.cdx.json
          upload-artifact: false

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'src-tauri/target/release/bundle/**/*'

      - name: Attach checksums and SBOM to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            SHA256SUMS-${{ matrix.label }}.txt
            sbom-${{ matrix.label }}.cdx.json
