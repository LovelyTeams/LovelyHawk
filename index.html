<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LovelyRes - Linux Emergency Response Tool</title>
  <meta name="description" content="Linux应急响应工具，支持SSH连接、终端操作、文件管理和Docker容器管理" />
  <!-- 语法高亮(highlight.js)与 Inter 字体均已改为本地打包引入,见 src/modules/core/vendorAssets.ts。
       赛场断网环境禁止依赖 CDN,请勿再在此处引入外部资源。 -->
  <script>
    // 在任何样式就位前同步恢复主题（与 src/modules/ui/theme.ts 的
    // lovelyres-theme 键一致），避免启动屏与首屏闪烁成错误主题。
    try {
      var __t = localStorage.getItem('lovelyres-theme');
      if (__t !== 'light' && __t !== 'dark' && __t !== 'sakura') __t = 'dark';
      document.documentElement.setAttribute('data-theme', __t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <style>
    /* 防止页面闪烁的基础样式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary, #0a0e1a);
      color: var(--text-primary, #e8eef7);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Loading Screen ─────────────────────────────────────────
       星空启动屏：星尘视差 + 轨道光环 + 扫描进度条。
       主题变量 (--ls-*) 默认值即深色；light / sakura 通过
       :root[data-theme] 覆盖，与三大主题一一对应。 */
    .loading-screen {
      --ls-bg: #0a0e1a;
      --ls-fg: #e8eef7;
      --ls-dim: #8b9bb8;
      --ls-a: #7dd3fc;
      --ls-b: #3aa0ff;
      --ls-track: rgba(139, 155, 184, 0.18);
      --ls-glow: rgba(58, 160, 255, 0.16);
      --ls-glow-strong: rgba(58, 160, 255, 0.42);
      --ls-star: rgba(139, 195, 255, 0.50);
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 32%, var(--ls-glow), transparent 44%),
        var(--ls-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    :root[data-theme="light"] .loading-screen {
      --ls-bg: #f8fafc;
      --ls-fg: #0f172a;
      --ls-dim: #64748b;
      --ls-a: #60a5fa;
      --ls-b: #818cf8;
      --ls-track: rgba(100, 116, 139, 0.18);
      --ls-glow: rgba(59, 130, 246, 0.12);
      --ls-glow-strong: rgba(59, 130, 246, 0.32);
      --ls-star: rgba(59, 130, 246, 0.40);
    }
    :root[data-theme="sakura"] .loading-screen {
      --ls-bg: #fef7fb;
      --ls-fg: #4a2039;
      --ls-dim: #9d7088;
      --ls-a: #f9a8d4;
      --ls-b: #e8849f;
      --ls-track: rgba(157, 112, 136, 0.22);
      --ls-glow: rgba(232, 132, 159, 0.14);
      --ls-glow-strong: rgba(232, 132, 159, 0.38);
      --ls-star: rgba(232, 132, 159, 0.45);
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* 星尘场：两层不同疏密的点阵以不同速度上浮，形成视差。
       位移恰好等于各自 tile 高度 = 无缝循环；transform 动画走合成层。 */
    .loading-screen::before,
    .loading-screen::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      pointer-events: none;
      background-repeat: repeat;
    }
    .loading-screen::before {
      height: calc(100% + 168px);
      background-image:
        radial-gradient(circle 1.4px at 24px 30px, var(--ls-star) 55%, transparent 100%),
        radial-gradient(circle 1.1px at 96px 104px, var(--ls-star) 55%, transparent 100%),
        radial-gradient(circle 1.2px at 140px 56px, var(--ls-star) 55%, transparent 100%);
      background-size: 168px 168px;
      animation: lsStarsNear 11s linear infinite;
    }
    .loading-screen::after {
      height: calc(100% + 252px);
      background-image:
        radial-gradient(circle 2px at 60px 80px, var(--ls-star) 45%, transparent 100%),
        radial-gradient(circle 1.6px at 190px 180px, var(--ls-star) 45%, transparent 100%);
      background-size: 252px 252px;
      opacity: 0.55;
      animation: lsStarsFar 17s linear infinite;
    }
    @keyframes lsStarsNear { to { transform: translateY(-168px); } }
    @keyframes lsStarsFar  { to { transform: translateY(-252px); } }

    .loading-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: lsFadeIn 0.6s ease-out;
    }

    /* Logo：星星 + 双轨道光环 */
    .ls-logo {
      position: relative;
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      animation: lsFloat 3.2s ease-in-out infinite;
    }
    @keyframes lsFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .ls-orbit {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      /* 只保留边缘 ~2px 的环带 */
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    }
    .ls-orbit-a {
      inset: 2px;
      background: conic-gradient(from 0deg, transparent 0 68%, var(--ls-a) 86%, var(--ls-b) 100%);
      animation: lsOrbit 2.6s linear infinite;
    }
    .ls-orbit-b {
      inset: -9px;
      background: conic-gradient(from 180deg, transparent 0 76%, var(--ls-b) 92%, transparent 100%);
      opacity: 0.55;
      animation: lsOrbit 4.4s linear infinite reverse;
    }
    @keyframes lsOrbit { to { transform: rotate(1turn); } }

    .ls-star-svg {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 6px 18px var(--ls-glow-strong));
    }
    .ls-stop-a { stop-color: var(--ls-a); }
    .ls-stop-b { stop-color: var(--ls-b); }

    .app-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ls-fg);
      font-family: 'Quicksand', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      opacity: 0;
      animation: lsSlideUp 0.6s ease-out 0.15s forwards;
    }

    .ls-subtitle {
      margin-top: -8px;
      font-size: 10px;
      letter-spacing: 0.34em;
      text-indent: 0.34em; /* 末字符字距视觉补偿 */
      color: var(--ls-dim);
      opacity: 0;
      animation: lsFadeIn 0.6s ease-out 0.25s forwards;
    }

    /* 扫描式进度条（不确定进度：来回扫，不假装有百分比） */
    .loading-bar-container {
      width: 172px;
      height: 3px;
      margin-top: 6px;
      background: var(--ls-track);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: lsFadeIn 0.6s ease-out 0.3s forwards;
    }
    .loading-bar {
      width: 42%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--ls-a), var(--ls-b), transparent);
      animation: lsScan 1.5s ease-in-out infinite;
    }
    @keyframes lsScan {
      from { transform: translateX(-110%); }
      to   { transform: translateX(260%); }
    }

    .loading-text {
      color: var(--ls-dim);
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      animation: lsFadeIn 0.6s ease-out 0.45s forwards;
    }

    @keyframes lsFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes lsSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-screen::before,
      .loading-screen::after,
      .ls-logo,
      .ls-orbit,
      .loading-bar {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <!-- 初始加载屏幕 -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="ls-logo">
        <span class="ls-orbit ls-orbit-a"></span>
        <span class="ls-orbit ls-orbit-b"></span>
        <svg class="ls-star-svg" width="64" height="64" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ls-s" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" class="ls-stop-a"/><stop offset="1" class="ls-stop-b"/></linearGradient>
            <linearGradient id="ls-h" x1=".36" y1="0" x2=".5" y2=".5"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          </defs>
          <g transform="rotate(-15 64 62)">
            <path d="M64,16 L75.8,47.8 L109.2,48.8 L83.2,68.8 L93,101.2 L64,83.2 L35,101.2 L44.8,68.8 L18.8,48.8 L52.2,47.8 Z" fill="url(#ls-s)" stroke="url(#ls-s)" stroke-width="12" stroke-linejoin="round" paint-order="stroke fill"/>
            <path d="M64,16 L75.8,47.8 L109.2,48.8 L83.2,68.8 L93,101.2 L64,83.2 L35,101.2 L44.8,68.8 L18.8,48.8 L52.2,47.8 Z" fill="url(#ls-h)" stroke="url(#ls-h)" stroke-width="12" stroke-linejoin="round" paint-order="stroke fill"/>
          </g>
        </svg>
      </div>
      <div class="app-title">LovelyRes</div>
      <div class="ls-subtitle">LINUX 应急响应工具</div>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-text">正在初始化系统…</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
