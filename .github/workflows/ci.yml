name: GPUI CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gpui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: GPUI Cargo quality gates
    runs-on: windows-latest
    steps:
      - name: Checkout repository and frozen baseline tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy

      - name: Restore Cargo build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Run native workspace quality gates
        shell: pwsh
        run: ./scripts/gpui-quality-gates.ps1 -ManifestPath ./Cargo.toml -ExpectedVersion 1.0.0
